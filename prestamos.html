<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Préstamos · Biblioteca</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#0f1117;--surface:#26131f;--card:#2c1a28;--accent:#f472b6;--accent-dim:rgba(244,114,182,0.12);--border:rgba(255,255,255,0.07);--input-bg:#36213a;}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Sora',sans-serif;background:var(--bg);color:#f0eef7;padding:24px 20px;}
        .back-btn{display:inline-flex;gap:8px;text-decoration:none;color:#a59bb5;margin-bottom:32px;}
        .layout{display:grid;grid-template-columns:340px 1fr;gap:20px;}
        .panel{background:var(--card);border-radius:16px;padding:22px;border:1px solid var(--border);margin-bottom:16px;}
        .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
        .btn-primary{background:var(--accent);color:#000;}
        .prestamo-card{background:var(--surface);border-radius:12px;padding:14px;margin-bottom:8px;border-left:3px solid var(--accent);}
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;}
        .modal-overlay.open{opacity:1;pointer-events:all;}
        .modal{background:var(--card);border-radius:20px;padding:26px;max-width:480px;width:100%;}
        .toast{position:fixed;bottom:24px;right:24px;background:#2c1a28;border-radius:12px;padding:12px;transition:0.35s;transform:translateY(80px);opacity:0;}
        .toast.show{transform:translateY(0);opacity:1;}
        @media(max-width:800px){.layout{grid-template-columns:1fr;}}
    </style>
</head>
<body>
<a class="back-btn" href="index.html">← Panel principal</a>
<div class="page-header"><span class="page-tag">Módulo · Préstamos</span><h1>🔄 Préstamos de libros</h1></div>
<div class="layout">
    <div><div class="panel"><div class="panel-title">➕ Nuevo préstamo</div><div class="two-col"><div class="field"><label>ID Usuario</label><input type="number" id="id_usuario" placeholder="1"></div><div class="field"><label>ID Libro</label><input type="number" id="id_libro" placeholder="2"></div></div><div class="two-col"><div class="field"><label>Fecha préstamo</label><input type="date" id="fecha_prestamo"></div><div class="field"><label>Fecha devolución</label><input type="date" id="fecha_devolucion"></div></div><button class="btn btn-primary btn-full" onclick="crearPrestamo()">Registrar préstamo</button></div>
    <div class="panel"><div class="panel-title">🔍 Buscar por ID</div><div class="row"><div class="field"><label>ID Préstamo</label><input type="number" id="buscarIdP"></div><button class="btn btn-ghost" onclick="obtenerPrestamo()">Buscar</button></div><div id="resultadoPrestamo"></div></div>
    <div class="panel"><div class="panel-title">🗑️ Eliminar préstamo</div><div class="row"><div class="field"><label>ID Préstamo</label><input type="number" id="deleteIdP"></div><button class="btn btn-danger" onclick="confirmarEliminarPrestamo()">Eliminar</button></div></div></div>
    <div class="list-panel"><div class="list-header"><span>📋 Préstamos registrados <span class="badge" id="countBadge">0</span></span><button class="btn btn-ghost btn-sm" onclick="obtenerPrestamos()">↻ Actualizar</button></div><div class="list-body" id="listaPrestamos" style="max-height:600px;overflow-y:auto;padding:14px;"></div></div>
</div>
<div class="modal-overlay" id="editModalPrestamo"><div class="modal"><div class="modal-title">✏️ Editar préstamo</div><input type="hidden" id="editIdPrestamo"><div class="two-col"><div class="field"><label>ID Usuario</label><input type="number" id="editIdUsuario"></div><div class="field"><label>ID Libro</label><input type="number" id="editIdLibro"></div></div><div class="two-col"><div class="field"><label>Fecha préstamo</label><input type="date" id="editFechaPrestamo"></div><div class="field"><label>Fecha devolución</label><input type="date" id="editFechaDevolucion"></div></div><div class="modal-actions" style="display:flex;gap:10px;margin-top:20px;"><button class="btn btn-ghost" onclick="cerrarModalPrestamo()">Cancelar</button><button class="btn btn-primary" onclick="actualizarPrestamo()">Guardar</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
    const API="http://127.0.0.1:3000/prestamos";
    function toast(m,t){const e=document.getElementById("toast");e.textContent=(t==="success"?"✅ ":"❌ ")+m;e.className=`toast ${t} show`;setTimeout(()=>e.classList.remove("show"),3200);}
    async function obtenerPrestamos(){try{const data=await(await fetch(API)).json();const cont=document.getElementById("listaPrestamos");document.getElementById("countBadge").textContent=data.length;if(!data.length){cont.innerHTML='<div class="empty-state">📭 Sin préstamos</div>';return;}cont.innerHTML="";data.forEach(p=>{const div=document.createElement("div");div.className="prestamo-card";div.innerHTML=`<div><strong>👤 ${p.usuario_nombre || `Usuario ${p.id_usuario}`}</strong> 📖 "${p.libro_titulo || `Libro ${p.id_libro}`}" <span class="id-chip">#${p.id_prestamo}</span></div><div>🗓️ Prestado: ${p.fecha_prestamo} | Devolución: ${p.fecha_devolucion || "Pendiente"}</div><div class="card-actions"><button class="btn btn-ghost btn-sm" onclick="abrirEditarPrestamo(${p.id_prestamo},${p.id_usuario},${p.id_libro},'${p.fecha_prestamo}','${p.fecha_devolucion || ''}')">✏️ Editar</button><button class="btn btn-danger btn-sm" onclick="eliminarDirectoPrestamo(${p.id_prestamo})">🗑️</button></div>`;cont.appendChild(div);});}catch{toast("Error conexión","error");}}
    async function crearPrestamo(){const id_usuario=document.getElementById("id_usuario").value;const id_libro=document.getElementById("id_libro").value;const fecha_prestamo=document.getElementById("fecha_prestamo").value;const fecha_devolucion=document.getElementById("fecha_devolucion").value;if(!id_usuario||!id_libro||!fecha_prestamo) return toast("Usuario, libro y fecha préstamo obligatorios","error");try{const res=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id_usuario:parseInt(id_usuario),id_libro:parseInt(id_libro),fecha_prestamo,fecha_devolucion:fecha_devolucion||null})});if(res.ok){toast("Préstamo registrado","success");document.getElementById("id_usuario").value="";document.getElementById("id_libro").value="";document.getElementById("fecha_prestamo").value="";document.getElementById("fecha_devolucion").value="";obtenerPrestamos();}else{const e=await res.json();toast(e.detail||"Error","error");}}catch{toast("Error","error");}}
    function abrirEditarPrestamo(id,idU,idL,fechaP,fechaD){document.getElementById("editIdPrestamo").value=id;document.getElementById("editIdUsuario").value=idU;document.getElementById("editIdLibro").value=idL;document.getElementById("editFechaPrestamo").value=fechaP;document.getElementById("editFechaDevolucion").value=fechaD;document.getElementById("editModalPrestamo").classList.add("open");}
    function cerrarModalPrestamo(){document.getElementById("editModalPrestamo").classList.remove("open");}
    async function actualizarPrestamo(){const id=document.getElementById("editIdPrestamo").value;const body={id_usuario:parseInt(document.getElementById("editIdUsuario").value),id_libro:parseInt(document.getElementById("editIdLibro").value),fecha_prestamo:document.getElementById("editFechaPrestamo").value,fecha_devolucion:document.getElementById("editFechaDevolucion").value||null};try{const res=await fetch(`${API}/${id}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});if(res.ok){toast("Préstamo actualizado","success");cerrarModalPrestamo();obtenerPrestamos();}else{toast("Error","error");}}catch{toast("Error","error");}}
    async function obtenerPrestamo(){const id=document.getElementById("buscarIdP").value;if(!id)return;try{const res=await fetch(`${API}/${id}`);if(!res.ok){toast("No encontrado","error");return;}const p=await res.json();document.getElementById("resultadoPrestamo").innerHTML=`<div class="prestamo-card"><strong>Préstamo #${p.id_prestamo}</strong> Usuario ${p.id_usuario} - Libro ${p.id_libro}<br>Fechas: ${p.fecha_prestamo} → ${p.fecha_devolucion}</div>`;}catch{toast("Error","error");}}
    function confirmarEliminarPrestamo(){const id=document.getElementById("deleteIdP").value;if(!id)return toast("ID requerido","error");eliminarDirectoPrestamo(id);}
    async function eliminarDirectoPrestamo(id){if(!confirm(`Eliminar préstamo #${id}?`))return;try{const res=await fetch(`${API}/${id}`,{method:"DELETE"});if(res.ok){toast("Eliminado","success");obtenerPrestamos();document.getElementById("deleteIdP").value="";}else{const e=await res.json();toast(e.detail||"Error","error");}}catch{toast("Error","error");}}
    document.getElementById("editModalPrestamo").addEventListener("click",(e)=>{if(e.target===e.currentTarget)cerrarModalPrestamo();});
    obtenerPrestamos();
</script>
</body>
</html>
