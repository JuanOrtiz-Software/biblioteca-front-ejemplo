<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios · Biblioteca</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#0f1117;--surface:#172121;--card:#1f2a2a;--accent:#3ecf8e;--accent-dim:rgba(62,207,142,0.12);--border:rgba(255,255,255,0.07);--input-bg:#2a3636;}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Sora',sans-serif;background:var(--bg);color:#e8eaf0;padding:24px 20px;}
        .back-btn{display:inline-flex;gap:8px;text-decoration:none;color:#8b9bb0;margin-bottom:32px;}
        .layout{display:grid;grid-template-columns:320px 1fr;gap:20px;}
        .panel{background:var(--card);border-radius:16px;padding:22px;margin-bottom:16px;border:1px solid var(--border);}
        .btn-primary{background:var(--accent);color:#000;}
        .usuario-card{background:var(--surface);border-radius:12px;padding:14px;margin-bottom:8px;}
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;}
        .modal-overlay.open{opacity:1;pointer-events:all;}
        .modal{background:var(--card);border-radius:20px;padding:26px;width:100%;max-width:400px;}
        .toast{position:fixed;bottom:24px;right:24px;background:#1f2a2a;border-radius:12px;padding:12px;transition:0.35s;transform:translateY(80px);opacity:0;}
        .toast.show{transform:translateY(0);opacity:1;}
        @media(max-width:800px){.layout{grid-template-columns:1fr;}}
    </style>
</head>
<body>
<a class="back-btn" href="index.html">← Panel principal</a>
<div class="page-header"><span class="page-tag">Módulo · Usuarios</span><h1>👥 Lectores</h1></div>
<div class="layout">
    <div><div class="panel"><div class="panel-title">➕ Nuevo usuario</div><div class="field"><label>Nombre</label><input type="text" id="nombreUser" placeholder="Ana López"></div><div class="field"><label>Correo</label><input type="email" id="correoUser" placeholder="ana@biblioteca.com"></div><button class="btn btn-primary btn-full" onclick="crearUsuario()">Registrar</button></div>
    <div class="panel"><div class="panel-title">🔍 Buscar</div><div class="row"><div class="field"><label>ID</label><input type="number" id="buscarIdUser"></div><button class="btn btn-ghost" onclick="obtenerUsuario()">Buscar</button></div><div id="resultadoUser"></div></div>
    <div class="panel"><div class="panel-title">🗑️ Eliminar</div><div class="row"><div class="field"><label>ID</label><input type="number" id="deleteIdUser"></div><button class="btn btn-danger" onclick="confirmarEliminarUser()">Eliminar</button></div></div></div>
    <div class="list-panel"><div class="list-header"><span>📋 Usuarios <span class="badge" id="countBadge">0</span></span><button class="btn btn-ghost btn-sm" onclick="obtenerUsuarios()">↻ Actualizar</button></div><div class="list-body" id="listaUsers" style="max-height:600px;overflow-y:auto;padding:14px;"></div></div>
</div>
<div class="modal-overlay" id="editModalUser"><div class="modal"><div class="modal-title">✏️ Editar usuario</div><input type="hidden" id="editIdUser"><div class="field"><label>Nombre</label><input type="text" id="editNombreUser"></div><div class="field"><label>Correo</label><input type="email" id="editCorreoUser"></div><div class="modal-actions" style="display:flex;gap:10px;margin-top:18px;"><button class="btn btn-ghost" onclick="cerrarModalUser()">Cancelar</button><button class="btn btn-primary" onclick="actualizarUsuario()">Guardar</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
    const API="http://127.0.0.1:3000/usuarios";
    function toast(m,t){const e=document.getElementById("toast");e.textContent=(t==="success"?"✅ ":"❌ ")+m;e.className=`toast ${t} show`;setTimeout(()=>e.classList.remove("show"),3200);}
    async function obtenerUsuarios(){try{const data=await(await fetch(API)).json();const cont=document.getElementById("listaUsers");document.getElementById("countBadge").textContent=data.length;if(!data.length){cont.innerHTML='<div class="empty-state">📭 Sin usuarios</div>';return;}cont.innerHTML="";data.forEach(u=>{const div=document.createElement("div");div.className="usuario-card";div.innerHTML=`<div><strong>${u.nombre}</strong> <span class="id-chip">#${u.id_usuario}</span></div><div>✉️ ${u.correo}</div><div class="card-actions"><button class="btn btn-ghost btn-sm" onclick="abrirEditarUser(${u.id_usuario},'${u.nombre.replace(/'/g,"\\'")}','${u.correo.replace(/'/g,"\\'")}')">✏️ Editar</button><button class="btn btn-danger btn-sm" onclick="eliminarDirectoUser(${u.id_usuario})">🗑️</button></div>`;cont.appendChild(div);});}catch{toast("Error conexión","error");}}
    async function crearUsuario(){const nombre=document.getElementById("nombreUser").value.trim();const correo=document.getElementById("correoUser").value.trim();if(!nombre||!correo) return toast("Complete campos","error");try{const res=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nombre,correo})});if(res.ok){toast("Usuario creado","success");document.getElementById("nombreUser").value="";document.getElementById("correoUser").value="";obtenerUsuarios();}else{const e=await res.json();toast(e.detail||"Error","error");}}catch{toast("Error","error");}}
    function abrirEditarUser(id,nombre,correo){document.getElementById("editIdUser").value=id;document.getElementById("editNombreUser").value=nombre;document.getElementById("editCorreoUser").value=correo;document.getElementById("editModalUser").classList.add("open");}
    function cerrarModalUser(){document.getElementById("editModalUser").classList.remove("open");}
    async function actualizarUsuario(){const id=document.getElementById("editIdUser").value;const body={nombre:document.getElementById("editNombreUser").value.trim(),correo:document.getElementById("editCorreoUser").value.trim()};try{const res=await fetch(`${API}/${id}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});if(res.ok){toast("Actualizado","success");cerrarModalUser();obtenerUsuarios();}else{toast("Error","error");}}catch{toast("Error","error");}}
    async function obtenerUsuario(){const id=document.getElementById("buscarIdUser").value;if(!id)return;try{const res=await fetch(`${API}/${id}`);if(!res.ok){toast("No encontrado","error");return;}const u=await res.json();document.getElementById("resultadoUser").innerHTML=`<div class="usuario-card"><strong>${u.nombre}</strong> - ${u.correo}</div>`;}catch{toast("Error","error");}}
    function confirmarEliminarUser(){const id=document.getElementById("deleteIdUser").value;if(!id)return toast("ID requerido","error");eliminarDirectoUser(id);}
    async function eliminarDirectoUser(id){if(!confirm(`Eliminar usuario #${id}?`))return;try{const res=await fetch(`${API}/${id}`,{method:"DELETE"});if(res.ok){toast("Eliminado","success");obtenerUsuarios();document.getElementById("deleteIdUser").value="";}else{const e=await res.json();toast(e.detail||"Error","error");}}catch{toast("Error","error");}}
    document.getElementById("editModalUser").addEventListener("click",(e)=>{if(e.target===e.currentTarget)cerrarModalUser();});
    obtenerUsuarios();
</script>
</body>
</html>
